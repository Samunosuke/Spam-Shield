<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Shield Primary Gradient (Vibrant Blue) -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>

    <!-- Checkmark Green Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Large Full-Bleed Shield Shape (maximized to fill the 128x128 canvas) -->
  <g filter="url(#dropShadow)">
    <path d="M 64,4 
             C 93,4 116,12 122,28 
             C 122,76 99,112 64,126 
             C 29,112 6,76 6,28 
             C 12,12 35,4 64,4 Z" 
          fill="url(#shieldGrad)" 
          stroke="url(#shieldBorder)" 
          stroke-width="4.5" />
  </g>

  <!-- Subtle 3D Highlight on Right Half -->
  <path d="M 64,8 
           C 90,8 111,15 117,29 
           C 117,73 96,107 64,121 
           L 64,8 Z" 
        fill="#ffffff" 
        opacity="0.12" />

  <!-- Crisp Inner Mail Envelope (Scaled Up & Centered) -->
  <g filter="url(#dropShadow)">
    <!-- Envelope Body -->
    <rect x="22" y="38" width="84" height="54" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Envelope Flap Line -->
    <path d="M 22,40 L 64,72 L 106,40" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Bottom Corner Folds -->
    <path d="M 22,90 L 48,68" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 106,90 L 80,68" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Large Verification Badge (Bottom-Right Floating Checkmark) -->
  <g filter="url(#badgeShadow)">
    <circle cx="94" cy="88" r="23" fill="#0f172a" stroke="#1e293b" stroke-width="3"/>
    <circle cx="94" cy="88" r="19" fill="url(#checkGrad)"/>
    
    <!-- Bold White Checkmark -->
    <path d="M 84,88 L 91,95 L 105,80" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>
