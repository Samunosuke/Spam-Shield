name: Lint & Pack Spam Shield

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          for file in *.js; do
            node --check "$file"
          done

      - name: Pack XPI and run Thunderbird webext-linter
        run: ./tests/run_linter.sh | tee tests/review_report.txt

      - name: Upload XPI and review report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: spam-shield-verification
          path: |
            spam.shield.xpi
            tests/review_report.txt
          if-no-files-found: warn

  release:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Pack XPI
        run: ./pack.sh

      - name: Extract release notes from CHANGE_LOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGE_LOG.md > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: spam.shield.xpi
          body_path: release_notes.md
          generate_release_notes: true

