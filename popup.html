<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title data-i18n="popup_title">Suke Email Validation</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup-body">
  <header class="app-header">
    <div>
      <h1 data-i18n="popup_title">Suke Email Validation</h1>
      <p id="modeIndicator" data-i18n="popup_loading">Lade Status…</p>
    </div>
    <button id="openOptionsBtn" data-i18n="popup_open_options" data-i18n-title="popup_open_options_title" title="Konfiguration &amp; ausführliche Live-Diagnose öffnen">⚙️ Einstellungen &amp; Diagnose</button>
  </header>

  <div class="btn-row">
    <button id="scanFolderBtn" class="btn-primary" data-i18n="popup_scan_folder">📂 Aktuellen Ordner prüfen</button>
    <button id="scanSelectedBtn" data-i18n="popup_scan_selected">✉️ Auswahl prüfen</button>
    <label style="margin-left:auto; display:inline-flex; align-items:center; gap:5px; font-size:12px; cursor:pointer;" data-i18n-title="popup_dryrun_title" title="Wenn aktiv, werden Spam-Mails nur bewertet und geloggt, aber nicht verschoben">
      <input type="checkbox" id="quickDryRunToggle">
      <span data-i18n="popup_dryrun_label">Dry-Run</span>
    </label>
  </div>

  <div id="scanBanner" class="scan-banner hidden">
    <span id="scanText" style="font-size:12px; font-weight:500;" data-i18n="popup_scanning">Prüfe…</span>
    <div class="progress-bar-wrap">
      <div id="scanProgressFill" class="progress-bar-fill"></div>
    </div>
  </div>

  <div id="statusMsg" class="muted" style="font-size:11.5px; display:none;"></div>

  <div style="display:flex; justify-content:space-between; align-items:center; margin-top:2px;">
    <strong style="font-size:12px;" data-i18n="popup_recent_header">Letzte Bewertungen (Live)</strong>
    <span id="logSummary" class="muted" style="font-size:11px;"></span>
  </div>

  <div id="popupLogList" class="popup-log-list">
    <div class="muted" style="padding:16px; text-align:center;" data-i18n="popup_empty_log">Noch keine E-Mails geprüft.</div>
  </div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
